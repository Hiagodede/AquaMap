name: Gerar APKs

on:
  workflow_dispatch:
  push:
    branches: [master, hiago]

# Needed to create the Release that the website download links point to.
permissions:
  contents: write

# One build per branch at a time: a newer push cancels the running one. Without this, two merges close together
# run in parallel and the older build can finish last, making the OLDER version the "latest" Release.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Instalar workload MAUI
        run: dotnet workload install maui
      - name: Keystore de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:ANDROID_KEYSTORE_BASE64 -or -not $env:ANDROID_KEYSTORE_PASSWORD) {
            Write-Error "Configure os secrets ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD no repositório."
            exit 1
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\aquamap-release.keystore", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
      # Mesma chave em todo build: o Android só instala uma versão nova por cima se a assinatura for igual.
      # versionCode = número da execução: cresce a cada build, então o Android aceita como atualização.
      # NÃO renomeie este arquivo: o run_number recomeçaria em 1 e os aparelhos recusariam a atualização.
      - name: APK do app Tecnico
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: dotnet publish AquaMap/AquaMap.csproj -f net9.0-android -c Release -p:AndroidPackageFormats=apk -p:ApplicationVersion=${{ github.run_number }} -p:ApplicationDisplayVersion=1.0.${{ github.run_number }} -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=${{ runner.temp }}\aquamap-release.keystore -p:AndroidSigningKeyAlias=aquamap -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD -o out/tecnico
      - name: APK do app Cidadao
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: dotnet publish AquaMap.Public/AquaMap.Public.csproj -f net9.0-android -c Release -p:AndroidPackageFormats=apk -p:ApplicationVersion=${{ github.run_number }} -p:ApplicationDisplayVersion=1.0.${{ github.run_number }} -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=${{ runner.temp }}\aquamap-release.keystore -p:AndroidSigningKeyAlias=aquamap -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD -o out/cidadao
      - uses: actions/upload-artifact@v4
        with:
          name: aquamap-apks
          path: out/**/*-Signed.apk

      # ---- Download on the website (master only) ----
      # Fixed file names keep https://github.com/Hiagodede/AquaMap/releases/latest/download/<name> stable forever.
      # Do NOT rename these files: the links on the website would break.
      - name: Renomear APKs com nome fixo
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $tecnico = Get-ChildItem out/tecnico -Filter *-Signed.apk | Select-Object -First 1
          $cidadao = Get-ChildItem out/cidadao -Filter *-Signed.apk | Select-Object -First 1
          if (-not $tecnico -or -not $cidadao) { Write-Error "APK assinado não encontrado."; exit 1 }
          Copy-Item $tecnico.FullName aquamap-tecnico.apk
          Copy-Item $cidadao.FullName aquamap-cidadao.apk

      - name: Publicar Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AquaMap 1.0.${{ github.run_number }}
          body: APKs gerados automaticamente a partir do commit ${{ github.sha }}.
          files: |
            aquamap-tecnico.apk
            aquamap-cidadao.apk
          make_latest: true
