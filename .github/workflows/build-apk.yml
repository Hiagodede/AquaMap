name: Gerar APKs

on:
  workflow_dispatch:
  push:
    branches: [master, hiago]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - name: Instalar workload MAUI
        run: dotnet workload install maui-android
      - name: Dependências do Android (API 36)
        run: dotnet build AquaMap.Client.Shared/AquaMap.Client.Shared.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AcceptAndroidSDKLicenses=True
      # APK de teste: assinado com chave de debug efêmera; NÃO atualiza o app já instalado nos celulares
      - name: APK do app Tecnico
        run: dotnet publish AquaMap/AquaMap.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk -o out/tecnico
      - name: APK do app Cidadao
        run: dotnet publish AquaMap.Public/AquaMap.Public.csproj -f net10.0-android -c Release -p:AndroidPackageFormats=apk -o out/cidadao
      - uses: actions/upload-artifact@v4
        with:
          name: aquamap-apks
          path: out/**/*-Signed.apk
